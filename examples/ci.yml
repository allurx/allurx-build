# 将 WORKFLOWS_COMMIT_SHA 替换为已审阅的 allurx-build 正式发行 commit。
name: CI
on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    verify:
        uses: allurx/allurx-build/.github/workflows/maven-ci.yml@WORKFLOWS_COMMIT_SHA
