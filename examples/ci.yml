name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: allurx/allurx-build/.github/workflows/maven-ci.yml@main

  # See docs/dependency-updates.md before changing the target branch or allowed ecosystems.
  dependabot-merge:
    needs: verify
    permissions:
      contents: write
      pull-requests: write
    uses: allurx/allurx-build/.github/workflows/dependabot-merge.yml@main
