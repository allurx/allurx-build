name: CI
on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
    cancel-in-progress: true
jobs:
    node:
        name: Node and package verification
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-2025]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - name: Install native GnuPG on Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  # Node 传入 Windows 路径，必须使用原生 GnuPG，不能使用 Git/MSYS 版本。
                  $installer = Join-Path $env:RUNNER_TEMP 'gnupg-w32-2.5.24_20260923.exe'
                  $directory = Join-Path $env:RUNNER_TEMP 'gnupg'
                  Invoke-WebRequest 'https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe' -OutFile $installer
                  if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'EA6F9DEE2CCCD83287432625B8B399173805ADD81D27067FCAF019C0C4DA1AD8') {
                      throw 'GnuPG installer checksum mismatch'
                  }
                  $installation = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$directory" -Wait -PassThru -WindowStyle Hidden
                  if ($installation.ExitCode -ne 0) { throw "GnuPG installation failed: $($installation.ExitCode)" }
                  $bin = Join-Path $directory 'bin'
                  $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  & "$bin\gpg.exe" --version
                  & "$bin\gpgconf.exe" --version
            - run: npm ci --ignore-scripts
            - run: npm run verify
            - name: Validate dependency update policy
              if: runner.os == 'Linux'
              run: npm exec --yes --package renovate@44.164.10 -- renovate-config-validator --strict default.json
    maven:
        uses: ./.github/workflows/maven-ci.yml
        with:
            working-directory: maven-parent
    java-consumers:
        name: Java template verification
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
            - uses: ./actions/setup-maven
            - name: Install the candidate parent and verify independent consumers
              run: bash scripts/verify-maven-parent.sh
    # 汇总所有验收任务，失败、取消和跳过都不能形成绿色门禁。
    required:
        name: CI required
        needs: [node, maven, java-consumers]
        if: always()
        runs-on: ubuntu-24.04
        steps:
            - env:
                  NODE_RESULT: ${{ needs.node.result }}
                  MAVEN_RESULT: ${{ needs.maven.result }}
                  CONSUMER_RESULT: ${{ needs.java-consumers.result }}
              run: test "$NODE_RESULT" = success && test "$MAVEN_RESULT" = success && test "$CONSUMER_RESULT" = success
