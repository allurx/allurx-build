name: Publish npm package
on:
    workflow_call:
        inputs:
            tag:
                description: 附带注释的包发布 tag
                type: string
                required: true
            workspace:
                description: npm workspace 目录；根包使用点号
                type: string
                default: js-config
            tag-prefix:
                description: 包语义版本之前的 tag 前缀
                type: string
                default: js-config-v
        outputs:
            version:
                description: 已核验的 npm 包版本
                value: ${{ jobs.publish.outputs.version }}
            commit:
                description: 发布 tag 指向的源码 commit
                value: ${{ jobs.publish.outputs.commit }}
            release-url:
                description: 完成核验的 GitHub Release 地址
                value: ${{ jobs.release.outputs.release-url }}
permissions: {}
jobs:
    build:
        name: Verify and retain npm package
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
            actions: read
        outputs:
            artifact-id: ${{ steps.retained.outputs.artifact-id || steps.archive.outputs.artifact-id }}
        env:
            RELEASE_TAG: ${{ inputs.tag }}
            TAG_PREFIX: ${{ inputs.tag-prefix }}
            PACKAGE_DIRECTORY: ${{ inputs.workspace }}
            RELEASE_DIR: ${{ github.workspace }}/release-data
        steps:
            - name: Check out package source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  fetch-depth: 0
                  path: project
                  persist-credentials: false
            - name: Check out matching release helpers
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .allurx-build
                  persist-credentials: false
            # 同一 workspace 复用固定归档；只有明确未发布时才补做首次打包。
            - name: Reuse the original package when rerunning
              id: retained
              env:
                  GH_TOKEN: ${{ github.token }}
                  PUBLISH_JOB_NAME: Publish retained npm package (${{ inputs.workspace }})
              run: |
                  set -euo pipefail
                  workspace_key="$(printf '%s' "$PACKAGE_DIRECTORY" | sha256sum | cut -c 1-16)"
                  artifact_name="npm-package-$GITHUB_RUN_ID-$workspace_key"
                  echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
                  id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate |
                    jq --raw-output --arg name "$artifact_name" '.artifacts[] | select(.name == $name and .expired == false) | .id')"
                  if [[ -n "$id" ]]; then
                    [[ "$id" =~ ^[0-9]+$ ]]
                    echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
                  elif [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
                    bash .allurx-build/scripts/assert-upload-not-started.sh \
                      "$PUBLISH_JOB_NAME" 'Publish using npm trusted publishing' project
                  fi
            - name: Set up the package runtime
              if: steps.retained.outputs.artifact-id == ''
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: project/.node-version
                  package-manager-cache: false
            - name: Verify package source
              if: steps.retained.outputs.artifact-id == ''
              working-directory: project
              run: npm ci && npm run verify
            - name: Pack the package once
              if: steps.retained.outputs.artifact-id == ''
              working-directory: project
              run: |
                  set -euo pipefail
                  mkdir -p "$RELEASE_DIR"
                  if [[ "$PACKAGE_DIRECTORY" == . ]]; then
                    npm pack --json --pack-destination "$RELEASE_DIR" > "$RELEASE_DIR/pack.json"
                  else
                    npm pack --workspace "$PACKAGE_DIRECTORY" --json --pack-destination "$RELEASE_DIR" > "$RELEASE_DIR/pack.json"
                  fi
            - name: Set up release helper runtime
              if: steps.retained.outputs.artifact-id == ''
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .allurx-build/.node-version
                  package-manager-cache: false
            - name: Install release helpers
              if: steps.retained.outputs.artifact-id == ''
              working-directory: .allurx-build
              run: npm ci --omit=dev --ignore-scripts --workspaces=false
            - name: Check package release identity
              if: steps.retained.outputs.artifact-id == ''
              id: identity
              working-directory: project
              run: |
                  set -euo pipefail
                  export PROJECT_VERSION="$(node --input-type=module -e 'import fs from "node:fs"; const packages = JSON.parse(fs.readFileSync(`${process.env.RELEASE_DIR}/pack.json`, "utf8")); if (packages.length !== 1) throw new Error("Expected one package"); console.log(packages[0].version)')"
                  node "$GITHUB_WORKSPACE/.allurx-build/src/release.ts" check-tag
            - name: Record the actual packed identity
              if: steps.retained.outputs.artifact-id == ''
              env:
                  EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
              run: node .allurx-build/src/release.ts npm-inspect
            - name: Retain the publishable tarball
              if: steps.retained.outputs.artifact-id == ''
              id: archive
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ steps.retained.outputs.artifact-name }}
                  path: |
                      release-data/*.tgz
                      release-data/npm-manifest.json
                  if-no-files-found: error
                  retention-days: 90

    # 发布阶段只消费已保留的 tarball，不重新执行构建或打包。
    publish:
        name: Publish retained npm package (${{ inputs.workspace }})
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment: npm
        permissions:
            contents: read
            actions: read
            id-token: write
        outputs:
            package-artifact-id: ${{ needs.build.outputs.artifact-id }}
            artifact-id: ${{ steps.archive.outputs.artifact-id }}
            version: ${{ steps.identity.outputs.version }}
            commit: ${{ steps.identity.outputs.commit }}
        env:
            RELEASE_TAG: ${{ inputs.tag }}
            TAG_PREFIX: ${{ inputs.tag-prefix }}
            PACKAGE_DIRECTORY: ${{ inputs.workspace }}
            RELEASE_DIR: ${{ github.workspace }}/release-data
        steps:
            - name: Check out the release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  fetch-depth: 0
                  path: project
                  persist-credentials: false
            - name: Check out matching release helpers
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .allurx-build
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .allurx-build/.node-version
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Install release helpers
              working-directory: .allurx-build
              run: npm ci --omit=dev --ignore-scripts --workspaces=false
            - name: Download the original tarball
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  artifact-ids: ${{ needs.build.outputs.artifact-id }}
                  path: release-data
                  merge-multiple: true
            - name: Check the retained package against the tag
              id: identity
              working-directory: project
              run: |
                  set -euo pipefail
                  export PROJECT_VERSION="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(`${process.env.RELEASE_DIR}/npm-manifest.json`, "utf8")).version)')"
                  node "$GITHUB_WORKSPACE/.allurx-build/src/release.ts" check-tag
            - name: Check whether the exact package is already published
              id: registry
              env:
                  EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
              run: node .allurx-build/src/release.ts npm-check
            - name: Publish using npm trusted publishing
              if: steps.registry.outputs.published == 'false'
              working-directory: project
              env:
                  PACKAGE_TARBALL: ${{ steps.registry.outputs.filename }}
              run: npm publish "$RELEASE_DIR/$PACKAGE_TARBALL" --access public --ignore-scripts --registry https://registry.npmjs.org
            - name: Verify registry integrity
              env:
                  EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
              run: node .allurx-build/src/release.ts npm-verify
            - name: Preserve registry verification
              id: archive
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: npm-publication-${{ needs.build.outputs.artifact-id }}-${{ github.run_attempt }}
                  path: |
                      release-data/npm-manifest.json
                      release-data/npm-verification.json
                  if-no-files-found: ignore
                  retention-days: 90

    # 收尾只复用原 tarball 和公开核验结果；恢复失败 job 不重新打包或发布 npm。
    release:
        name: Create GitHub Release
        needs: publish
        if: ${{ !cancelled() && needs.publish.result == 'success' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
            actions: read
        outputs:
            release-url: ${{ steps.release.outputs.release-url }}
        env:
            RELEASE_TAG: ${{ inputs.tag }}
            TAG_PREFIX: ${{ inputs.tag-prefix }}
            PACKAGE_DIRECTORY: ${{ inputs.workspace }}
            EXPECTED_COMMIT: ${{ needs.publish.outputs.commit }}
            RELEASE_DIR: ${{ github.workspace }}/release-data
        steps:
            - name: Check out matching release helpers
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .allurx-build
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .allurx-build/.node-version
                  package-manager-cache: false
            - name: Install release helpers
              working-directory: .allurx-build
              run: npm ci --omit=dev --ignore-scripts --workspaces=false
            - name: Download the original package and registry verification
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  artifact-ids: ${{ needs.publish.outputs.package-artifact-id }},${{ needs.publish.outputs.artifact-id }}
                  path: release-data
                  merge-multiple: true
            - name: Publish release notes and verification
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node .allurx-build/src/release.ts npm-github-release
            - name: Show verified release
              env:
                  RELEASE_URL: ${{ steps.release.outputs.release-url }}
              run: |
                  printf 'Release: %s\n' "$RELEASE_URL"
